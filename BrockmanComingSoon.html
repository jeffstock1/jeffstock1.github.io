<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brockman Bunny Battles — Coming Soon</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#f0e8c8;font-family:'Courier New',monospace;}
  canvas{display:block;width:100%;height:100%;position:fixed;top:0;left:0;}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
  #title{font-size:clamp(36px,7vw,88px);color:#1a1a2e;letter-spacing:6px;line-height:1;text-shadow:4px 4px 0 #c8a860,6px 6px 0 rgba(0,0,0,0.15);text-align:center;}
  #subtitle{font-size:clamp(14px,2.5vw,26px);color:#8B4513;letter-spacing:4px;margin:12px 0 8px;text-align:center;}
  #school{font-size:clamp(10px,1.5vw,16px);color:#a08040;letter-spacing:3px;margin-bottom:36px;text-align:center;}
  #badge{background:#1a1a2e;color:#f1c40f;font-size:clamp(12px,1.8vw,18px);letter-spacing:3px;padding:12px 32px;border:2px solid #f1c40f;border-radius:4px;text-align:center;}
  #worms{margin-top:28px;font-size:clamp(10px,1.3vw,14px);color:#9b59b6;letter-spacing:2px;animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:0.5;}50%{opacity:1;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">BROCKMAN</div>
  <div id="subtitle">BUNNY BATTLES</div>
  <div id="school">&#11088; BROCKMAN ELEMENTARY SCHOOL &#11088;</div>
  <div id="badge">&#128048; COMING SOON &#128048;</div>
  <div id="worms">&#127744; wormholes detected in the building &#127744;</div>
</div>
<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener("resize",resize);

function drawFloor(){
  const ts=60;
  for(let x=0;x<W+ts;x+=ts)for(let y=0;y<H+ts;y+=ts){
    ctx.fillStyle=(Math.floor(x/ts)+Math.floor(y/ts))%2===0?"#ede4c0":"#e8ddb8";
    ctx.fillRect(x,y,ts,ts);
  }
  ctx.strokeStyle="rgba(0,0,0,0.06)";ctx.lineWidth=1;
  for(let x=0;x<=W+ts;x+=ts){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H+ts;y+=ts){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

const TYPES=[
  {fur:"#e8e0c8",belly:"#f8f0e0",ear:"#ffb6c1",eye:"#1a0a00"},
  {fur:"#7a4a9a",belly:"#b880d8",ear:"#d090f0",eye:"#cc00ff"},
  {fur:"#8a8c8a",belly:"#b0b2b0",ear:"#c8cac8",eye:"#1a0a00"},
  {fur:"#a8d8a0",belly:"#d0f0c8",ear:"#90e880",eye:"#1a0a00"},
  {fur:"#d08070",belly:"#f0b090",ear:"#ffb6c1",eye:"#1a0a00"},
];

class Bunny{
  constructor(){this.reset(true);}
  reset(init=false){
    this.type=TYPES[Math.floor(Math.random()*TYPES.length)];
    this.sz=18+Math.random()*14;
    const side=Math.floor(Math.random()*4);
    if(side===0){this.x=Math.random()*W;this.y=-this.sz*3;}
    else if(side===1){this.x=W+this.sz*3;this.y=Math.random()*H;}
    else if(side===2){this.x=Math.random()*W;this.y=H+this.sz*3;}
    else{this.x=-this.sz*3;this.y=Math.random()*H;}
    if(init){this.x=Math.random()*W;this.y=Math.random()*H;}
    this.tx=80+Math.random()*(W-160);this.ty=80+Math.random()*(H-160);
    const dx=this.tx-this.x,dy=this.ty-this.y,dist=Math.hypot(dx,dy)||1,spd=0.6+Math.random()*1.0;
    this.vx=dx/dist*spd;this.vy=dy/dist*spd;
    this.hopTimer=0;this.hopHeight=0;this.walkFrame=Math.floor(Math.random()*8);
    this.arrived=false;this.waitTimer=0;this.dir=this.vx>0?"right":"left";
  }
  update(dt){
    this.hopTimer+=dt*0.12;
    if(!this.arrived){
      this.x+=this.vx*dt;this.y+=this.vy*dt;
      this.hopHeight=Math.max(0,Math.sin(this.hopTimer*3.5)*this.sz*0.55);
      this.walkFrame=(this.walkFrame+dt*0.15)%8;
      if(Math.hypot(this.tx-this.x,this.ty-this.y)<4){this.arrived=true;this.waitTimer=60+Math.random()*120;this.hopHeight=0;}
    } else {
      this.waitTimer-=dt;this.hopHeight=Math.abs(Math.sin(this.hopTimer*0.8))*2;
      if(this.waitTimer<=0)this.reset();
    }
  }
  draw(c){
    const sz=this.sz,flip=this.dir==="left"?-1:1;
    c.save();c.translate(this.x,this.y-this.hopHeight);c.scale(flip,1);
    c.save();c.globalAlpha=0.12+this.hopHeight/sz*0.1;
    c.beginPath();c.ellipse(0,sz*1.05+this.hopHeight*0.3,sz*0.85,sz*0.22,0,0,Math.PI*2);
    c.fillStyle="#000";c.fill();c.restore();
    const {fur,belly,ear,eye}=this.type;
    c.beginPath();c.ellipse(0,sz*0.12,sz*0.78,sz*0.92,0,0,Math.PI*2);c.fillStyle=fur;c.fill();
    c.beginPath();c.ellipse(0,sz*0.28,sz*0.38,sz*0.52,0,0,Math.PI*2);c.fillStyle=belly;c.fill();
    c.save();c.globalAlpha=0.12;c.strokeStyle="#000";c.lineWidth=1;
    for(let i=0;i<7;i++){const a=i/7*Math.PI*2,r=sz*0.5;c.beginPath();c.moveTo(Math.cos(a)*r*0.55,sz*0.12+Math.sin(a)*r*0.6);c.lineTo(Math.cos(a)*r*0.9,sz*0.12+Math.sin(a)*r*0.92);c.stroke();}
    c.restore();
    [-0.38,0.38].forEach(ex=>{
      c.save();c.translate(ex*sz,-sz*0.65);c.rotate(ex*0.18);
      c.beginPath();c.ellipse(0,0,sz*0.22,sz*0.64,0,0,Math.PI*2);c.fillStyle=fur;c.fill();c.strokeStyle="rgba(0,0,0,0.12)";c.lineWidth=0.8;c.stroke();
      c.beginPath();c.ellipse(0,sz*0.04,sz*0.1,sz*0.46,0,0,Math.PI*2);c.fillStyle=ear;c.fill();c.restore();
    });
    c.beginPath();c.ellipse(0,-sz*0.6,sz*0.55,sz*0.5,0,0,Math.PI*2);c.fillStyle=fur;c.fill();
    c.beginPath();c.ellipse(-sz*0.34,-sz*0.53,sz*0.2,sz*0.16,-.3,0,Math.PI*2);c.fillStyle=belly;c.fill();
    c.beginPath();c.ellipse(sz*0.34,-sz*0.53,sz*0.2,sz*0.16,.3,0,Math.PI*2);c.fillStyle=belly;c.fill();
    [-0.26,0.26].forEach(ex=>{
      c.beginPath();c.ellipse(ex*sz,-sz*0.67,sz*0.165,sz*0.17,0,0,Math.PI*2);c.fillStyle="#f8f4f0";c.fill();
      c.beginPath();c.arc(ex*sz,-sz*0.67,sz*0.1,0,Math.PI*2);c.fillStyle=eye;c.fill();
      c.beginPath();c.arc(ex*sz,-sz*0.67,sz*0.048,0,Math.PI*2);c.fillStyle="#000";c.fill();
      c.beginPath();c.arc(ex*sz-sz*0.05,-sz*0.7,sz*0.036,0,Math.PI*2);c.fillStyle="rgba(255,255,255,0.85)";c.fill();
    });
    c.beginPath();c.ellipse(0,-sz*0.54,sz*0.09,sz*0.065,0,0,Math.PI*2);c.fillStyle="#d87090";c.fill();
    c.strokeStyle=fur;c.lineWidth=0.7;
    c.beginPath();c.moveTo(-sz*0.07,-sz*0.48);c.quadraticCurveTo(0,-sz*0.43,sz*0.07,-sz*0.48);c.stroke();
    c.strokeStyle="rgba(255,255,255,0.5)";c.lineWidth=0.6;
    [[-1,0.8],[-.6,0.45],[1,-0.8],[.6,-0.45]].forEach(([ox,ang])=>{
      c.save();c.translate(ox*sz*0.22,-sz*0.51);c.rotate(ang*0.22);
      c.beginPath();c.moveTo(0,0);c.lineTo(ox*sz*1.0,0);c.stroke();c.restore();
    });
    const lSwing=Math.sin(this.walkFrame*0.8)*sz*0.14*(this.arrived?0.1:1);
    [-1,1].forEach(side=>{
      c.beginPath();c.ellipse(side*sz*0.52,sz*0.78,sz*0.26,sz*0.19,side*0.38,0,Math.PI*2);
      c.fillStyle=fur;c.fill();c.strokeStyle="rgba(0,0,0,0.12)";c.lineWidth=0.6;c.stroke();
      for(let toe=-1;toe<=1;toe++){c.beginPath();c.ellipse(side*sz*0.52+toe*sz*0.09,sz*0.88,sz*0.075,sz*0.055,0,0,Math.PI*2);c.fillStyle=belly;c.fill();}
    });
    [-1,1].forEach(side=>{
      c.beginPath();c.ellipse(side*sz*0.66,sz*0.08+lSwing*side,sz*0.17,sz*0.26,side*0.45,0,Math.PI*2);
      c.fillStyle=fur;c.fill();c.strokeStyle="rgba(0,0,0,0.1)";c.lineWidth=0.6;c.stroke();
    });
    c.beginPath();c.arc(0,sz*0.9,sz*0.2,0,Math.PI*2);c.fillStyle=belly;c.fill();c.strokeStyle=fur;c.lineWidth=0.6;c.stroke();
    c.restore();
  }
}

class Wormhole{
  constructor(){this.x=Math.random()*W;this.y=Math.random()*H;this.r=22+Math.random()*18;this.phase=Math.random()*Math.PI*2;this.isDim=Math.random()<0.3;}
  draw(c,t){
    const cx=this.x,cy=this.y,r=this.r;
    const col1=this.isDim?"#1a5888":"#521288",col2=this.isDim?"#3a9adc":"#a030e8",col3=this.isDim?"#8acdff":"#e090ff";
    for(let i=0;i<3;i++){
      const angle=(t+this.phase)*(i%2===0?1.2:-0.9)+i*Math.PI*2/3;
      const rx=r*(0.7+0.3*Math.abs(Math.sin(t*0.8+i+this.phase))),ry=r*(0.5+0.2*Math.abs(Math.cos(t*0.8+i+this.phase)));
      c.save();c.translate(cx,cy);c.rotate(angle);c.beginPath();c.ellipse(0,0,rx,ry,0,0,Math.PI*2);c.strokeStyle=col2+"55";c.lineWidth=1.5;c.stroke();c.restore();
    }
    const g=c.createRadialGradient(cx,cy,r*0.2,cx,cy,r*1.6);
    g.addColorStop(0,col1+"bb");g.addColorStop(0.5,col2+"33");g.addColorStop(1,"transparent");
    c.beginPath();c.arc(cx,cy,r*1.6,0,Math.PI*2);c.fillStyle=g;c.fill();
    const g2=c.createRadialGradient(cx,cy,0,cx,cy,r);
    g2.addColorStop(0,"#000000ee");g2.addColorStop(0.55,col1+"cc");g2.addColorStop(1,col2+"88");
    c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fillStyle=g2;c.fill();
    c.save();c.translate(cx,cy);c.rotate((t+this.phase)*1.4);c.strokeStyle=col3+"99";c.lineWidth=1;
    for(let i=0;i<4;i++){c.save();c.rotate(i*Math.PI/2);c.beginPath();c.moveTo(r*0.1,0);c.quadraticCurveTo(r*0.5,r*0.3,r*0.7,0);c.stroke();c.restore();}
    c.restore();
    c.save();c.translate(cx,cy);c.rotate(-(t+this.phase)*2);c.fillStyle=col3;
    for(let i=0;i<4;i++){c.save();c.rotate(i*Math.PI/2);c.beginPath();c.moveTo(0,-r*0.18);c.lineTo(r*0.06,-r*0.06);c.lineTo(r*0.18,0);c.lineTo(r*0.06,r*0.06);c.lineTo(0,r*0.18);c.lineTo(-r*0.06,r*0.06);c.lineTo(-r*0.18,0);c.lineTo(-r*0.06,-r*0.06);c.closePath();c.fill();c.restore();}
    c.restore();
  }
}

class Particle{
  constructor(x,y,col){
    this.x=x;this.y=y;this.col=col;
    const a=Math.random()*Math.PI*2,s=Math.random()*2+0.5;
    this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
    this.life=40+Math.random()*30;this.maxLife=this.life;this.r=Math.random()*3+1;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.05;this.life--;}
  draw(c){c.globalAlpha=this.life/this.maxLife*0.7;c.beginPath();c.arc(this.x,this.y,this.r,0,Math.PI*2);c.fillStyle=this.col;c.fill();c.globalAlpha=1;}
}

const bunnies=Array.from({length:14},()=>new Bunny());
const wormholes=Array.from({length:5},()=>new Wormhole());
const particles=[];
let t=0,last=0,pTimer=0;

function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-last)/16.67,3);last=ts;t+=dt*0.016;
  drawFloor();
  wormholes.forEach(w=>w.draw(ctx,t));
  pTimer+=dt;
  if(pTimer>18){
    pTimer=0;
    const wh=wormholes[Math.floor(Math.random()*wormholes.length)];
    const col=wh.isDim?"#8acdff":"#e090ff";
    for(let i=0;i<8;i++)particles.push(new Particle(wh.x,wh.y,col));
  }
  for(let i=particles.length-1;i>=0;i--){particles[i].update();particles[i].draw(ctx);if(particles[i].life<=0)particles.splice(i,1);}
  bunnies.sort((a,b)=>a.y-b.y);
  bunnies.forEach(b=>{b.update(dt);b.draw(ctx);});
}
requestAnimationFrame(loop);
</script>
</body>
</html>
